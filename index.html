<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="万象：名画、星海、植物、传统色、原创游戏与书房，选一个世界进入。" />
  <title>万象 · 选择你的世界</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="万象" />
  <!-- 分享预览（微信 / QQ / 社交平台） -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="万象" />
  <meta property="og:title" content="万象 · 选择你的世界" />
  <meta property="og:description" content="名画、星海、植物、传统色、原创游戏厅与书房——像选角色一样，挑一个世界进去。" />
  <meta property="og:image" content="https://koshokai.github.io/mybooks/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="hub/hub.css" />
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="ghost" id="ghost" aria-hidden="true"></div>

  <header class="hub-top">
    <div class="logo"><b>万象</b><span>WANXIANG</span></div>
    <div class="headline">
      <h1>选择你的世界</h1>
      <p>CHOOSE YOUR WORLD</p>
    </div>
    <div class="count"><b id="idx">01</b> / <span id="total">06</span></div>
  </header>

  <main class="roster" id="roster" role="listbox" aria-label="世界列表"></main>

  <footer class="hub-foot">
    <span class="keys"><kbd>←</kbd><kbd>→</kbd> 选择　<kbd>Enter</kbd> 进入</span>
    <span class="touch">点选世界 · 再点一次进入</span>
  </footer>

  <div class="warp" id="warp" aria-hidden="true"><b id="warpGlyph"></b></div>

  <script src="shared/status.js"></script>
  <script src="hub/hub.js"></script>
  <script>/* 离线缓存：第二次打开更快，断网也能看已打开过的世界 */
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /[?&]sw\b/.test(location.search)))
      addEventListener("load", () => navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {}));
  </script>
</body>
</html>
