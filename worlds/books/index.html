<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120d09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MyBooks · 书房</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ========== 开场：选择书房 ========== -->
  <section id="splash" class="splash">
    <a class="hub-back hub-back-abs" href="../../index.html">← 返回 <b>书</b></a>
    <div class="splash-glow"></div>
    <div class="dust" aria-hidden="true"></div>
    <div class="splash-inner">
      <p class="eyebrow">MY&nbsp;BOOKS · EST. 2026</p>
      <h1 class="splash-title">书&nbsp;房</h1>
      <p class="splash-sub">推开门，选一面书墙，与好书相遇</p>

      <div class="doors">
        <button class="door" data-enter="cn">
          <span class="door-arch"><span class="door-spines" data-mini="cn"></span></span>
          <span class="door-name">华语书房</span>
          <span class="door-en">CHINESE AUTHORS</span>
          <span class="door-count" data-count="cn"></span>
        </button>
        <button class="door" data-enter="world">
          <span class="door-arch"><span class="door-spines" data-mini="world"></span></span>
          <span class="door-name">世界书房</span>
          <span class="door-en">WORLD AUTHORS</span>
          <span class="door-count" data-count="world"></span>
        </button>
        <button class="door" data-enter="lists">
          <span class="door-arch"><span class="door-spines" data-mini="lists"></span></span>
          <span class="door-name">名家书单</span>
          <span class="door-en">CURATED LISTS</span>
          <span class="door-count">樊登 · 董宇辉</span>
        </button>
      </div>
      <button class="enter-all" data-enter="all">进入全部藏书 →</button>
    </div>
  </section>

  <!-- ========== 主界面 ========== -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <a class="hub-back" href="../../index.html" title="返回选择世界">←</a>
      <button class="brand" id="homeBtn" title="回到门厅">
        <span class="brand-mark">书</span>
        <span class="brand-text">MyBooks<small>书房</small></span>
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="搜索书名、作者…" autocomplete="off" />
      </label>
      <button class="ghost-btn" id="randomBtn" title="随机抽一本">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/></svg>
        <span>随机一本</span>
      </button>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <section class="hero" id="hero"></section>

    <main class="room">
      <div class="bookcase" id="bookcase"></div>
    </main>

    <footer class="foot">藏书 <b id="totalCount"></b> 册 · 书目推荐整理自公开信息，仅供参考</footer>
  </div>

  <!-- ========== 书籍详情 ========== -->
  <div class="detail" id="detail" hidden>
    <div class="detail-backdrop" data-close></div>
    <article class="detail-card" role="dialog" aria-modal="true">
      <button class="close-btn" data-close aria-label="关闭">×</button>
      <div class="stage" id="stage">
        <div class="book3d" id="book3d"></div>
        <p class="stage-hint">拖动可旋转</p>
      </div>
      <div class="info" id="info"></div>
    </article>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
