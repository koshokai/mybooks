<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08040f" />
  <title>游戏厅 · 万象</title>
  <link rel="icon" href="../../icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="arcade.css" />
</head>
<body>
  <div class="room" aria-hidden="true">
    <div class="ceiling"></div>
    <div class="floor"></div>
  </div>

  <header class="top">
    <a class="back" href="../../index.html">← 返回 <b>游</b></a>
    <div class="sign" aria-label="游戏厅">
      <span class="sign-zh">游<i>戏</i>厅</span>
      <span class="sign-en">WANXIANG ARCADE</span>
    </div>
    <button class="wallet" id="wallet" title="我的星尘与成就">
      <span class="dust-ico"></span><b id="dust">0</b><small>星尘</small>
    </button>
  </header>

  <main class="hall" id="hall" aria-label="游戏机"></main>
  <nav class="dots" id="dots" aria-hidden="true"></nav>
  <p class="tip">每个游戏里赚到的<b>星尘</b>都会存进同一个账户 · 进度只保存在本机</p>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-bg" data-close></div>
    <div class="drawer-card">
      <button class="x" data-close aria-label="关闭">×</button>
      <h2>我的游戏档案</h2>
      <div class="big-dust"><span class="dust-ico"></span><b id="dust2">0</b><small>星尘</small></div>
      <div class="per" id="per"></div>
      <h3>成就 <span id="achCount"></span></h3>
      <ul class="ach" id="ach"></ul>
    </div>
  </aside>

  <div class="zoom" id="zoom" aria-hidden="true"></div>

  <script src="../../shared/status.js"></script>
  <script src="../../shared/arcade.js"></script>
  <script src="lobby.js"></script>
  <script>/* 离线缓存：第二次打开更快，断网也能看已打开过的世界 */
    if ("serviceWorker" in navigator && (location.protocol === "https:" || /[?&]sw\b/.test(location.search)))
      addEventListener("load", () => navigator.serviceWorker.register("../../sw.js", { scope: "../../" }).catch(() => {}));
  </script>
</body>
</html>
